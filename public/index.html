<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Proxy Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #161b22;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 20px; text-align: center; color: #f0f6fc; }
    .input-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 1rem;
      outline: none;
      min-width: 200px;
    }
    .input-group input:focus { border-color: #58a6ff; }
    .input-group button {
      padding: 12px 24px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .input-group button:hover { background: #2ea043; }
    .player-wrapper {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
      padding-top: 56.25%;
    }
    .player-wrapper video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
    }
    .actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .actions button {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .actions button:active { transform: scale(0.97); }
    .btn-download { background: #1f6feb; color: white; }
    .btn-download:hover { background: #388bfd; }
    .btn-download:disabled { opacity: 0.5; pointer-events: none; }
    .btn-copy { background: #30363d; color: #e6edf3; }
    .btn-copy:hover { background: #3d444d; }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.95rem;
      background: #21262d;
      color: #8b949e;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
    }
    .status.error { background: #2d1b1e; color: #f85149; }
    .status.success { background: #1b2d1f; color: #3fb950; }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #8b949e;
      border-top: 1px solid #21262d;
      padding-top: 15px;
    }
    .footer a { color: #58a6ff; text-decoration: none; }
    @media (max-width: 600px) {
      .container { padding: 15px; }
      .input-group { flex-direction: column; }
      .input-group button { width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎬 Video Proxy Player</h1>
  <div class="input-group">
    <input type="url" id="videoUrl" placeholder="Paste video URL (e.g., https://example.com/video.mp4)" autofocus />
    <button id="loadBtn">Load &amp; Play</button>
  </div>
  <div class="player-wrapper">
    <video id="videoPlayer" controls playsinline></video>
  </div>
  <div class="actions">
    <button class="btn-download" id="downloadBtn" disabled>⬇ Download Video</button>
    <button class="btn-copy" id="copyBtn">📋 Copy Proxy URL</button>
  </div>
  <div class="status" id="status">Paste a video URL and click "Load &amp; Play"</div>
  <div class="footer">
    🔒 All requests are proxied through your server – bypass CORS &amp; regional blocks.
  </div>
</div>
<script>
  const videoUrlInput = document.getElementById('videoUrl');
  const loadBtn = document.getElementById('loadBtn');
  const videoPlayer = document.getElementById('videoPlayer');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn = document.getElementById('copyBtn');
  const statusDiv = document.getElementById('status');

  function getProxyUrl(originalUrl) {
    const base = window.location.origin + '/api/proxy?url=';
    return base + encodeURIComponent(originalUrl);
  }

  function loadVideo(originalUrl) {
    if (!originalUrl || !originalUrl.trim()) {
      setStatus('Please enter a valid URL.', 'error');
      return;
    }
    const proxyUrl = getProxyUrl(originalUrl);
    videoPlayer.src = proxyUrl;
    videoPlayer.load();
    videoPlayer.play().catch(() => {});
    downloadBtn.disabled = false;
    downloadBtn.onclick = () => window.open(proxyUrl, '_blank');
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(proxyUrl).then(() => {
        setStatus('✅ Proxy URL copied to clipboard!', 'success');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = proxyUrl;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setStatus('✅ Proxy URL copied!', 'success');
      });
    };
    setStatus(`✅ Loaded: ${originalUrl}`, 'success');
  }

  function setStatus(msg, type = 'info') {
    statusDiv.textContent = msg;
    statusDiv.className = 'status';
    if (type === 'error') statusDiv.classList.add('error');
    if (type === 'success') statusDiv.classList.add('success');
  }

  loadBtn.addEventListener('click', () => loadVideo(videoUrlInput.value));
  videoUrlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadBtn.click(); });

  const urlParams = new URLSearchParams(window.location.search);
  const initialUrl = urlParams.get('url');
  if (initialUrl) {
    videoUrlInput.value = initialUrl;
    loadVideo(initialUrl);
  }

  videoPlayer.addEventListener('error', (e) => {
    const err = videoPlayer.error;
    let msg = 'Video error: ';
    if (err) {
      switch (err.code) {
        case 1: msg += 'MEDIA_ERR_ABORTED'; break;
        case 2: msg += 'NETWORK – proxy down or video unavailable.'; break;
        case 3: msg += 'DECODE – video may be corrupted.'; break;
        case 4: msg += 'FORMAT not supported.'; break;
        default: msg += err.message;
      }
    } else {
      msg += 'Unknown error.';
    }
    setStatus('❌ ' + msg, 'error');
  });
</script>
</body>
</html>
